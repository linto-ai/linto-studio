<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#11977c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LinTO Studio" />
    <title>LinTO Studio</title>
    <link rel="icon" href="/img/linto.svg" />
    <link rel="apple-touch-icon" href="/img/pwa/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="stylesheet"
      type="text/css"
      media="screen"
      href="/fonts/Noto_Sans/noto.css" />
    <link
      rel="stylesheet"
      type="text/css"
      media="screen"
      href="/fonts/atkinson.css" />
    <!-- Runtime configuration (generated by docker-entrypoint.sh in production) -->
    <script src="/config.js"></script>
    <!-- Boot screen, before the JS runs (the app's tokens are not loaded
         yet: values copied from src/mobile/style/tokens.css). -->
    <style>
      .m-boot {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: oklch(97% 0.006 160);
      }
      .m-boot__spinner {
        width: 24px;
        height: 24px;
        border: 3px solid #11977c;
        border-right-color: transparent;
        border-radius: 50%;
        animation: m-boot-spin 1s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .m-boot__spinner {
          animation-duration: 3s;
        }
      }
      @keyframes m-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      <strong>LinTO Studio needs JavaScript enabled to run.</strong>
    </noscript>
    <!-- Replaced by the app when it mounts (AppLoading takes over). -->
    <div id="app">
      <div class="m-boot" role="status" aria-label="LinTO Studio">
        <img src="/img/linto.svg" alt="" width="64" height="64" />
        <span class="m-boot__spinner" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/mobile/main.js"></script>
  </body>
</html>
