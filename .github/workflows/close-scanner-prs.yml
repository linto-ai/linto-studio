name: Close automated scanner PRs

# Closes unsolicited pull requests generated by vulnerability scanners
# (see CONTRIBUTING.md). Matches known signatures in the PR body.

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.repository_owner == 'linto-ai'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request.body || '').toLowerCase();
            const signatures = [
              'automated security fix by',
              'orbis-meta:',
              'orbisappsec.com',
              'this change addresses a pattern flagged by static analysis',
            ];
            if (!signatures.some(s => body.includes(s))) {
              console.log('No scanner signature found');
              return;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: 'Closing: automated scanner pull requests are not accepted in this repository. See CONTRIBUTING.md. If you found a real, reachable vulnerability, follow SECURITY.md.',
            });
            await github.rest.pulls.update({ owner, repo, pull_number: issue_number, state: 'closed' });
